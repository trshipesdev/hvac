[pytest]
# loadscope pins each test class/module to one xdist worker so tests sharing
# state within a class/module never race, while still parallelizing across
# classes/modules. Run serial with `-n 0` (not `-p no:xdist`, which errors
# since addopts already passes -n/--dist).
required_plugins = pytest-xdist
addopts = -n 2 --dist loadscope
